# Format, lint, comment-format, typecheck, test and audit checks on the
# greg-zone Woodpecker instance: one shared `bun install`, then the checks fan
# out in parallel.
#
# `greg-zone/bun-git` is oven/bun plus git, built locally on the CI host from
# greg-zone/ci/bun-git/Dockerfile (git is needed by the merge-base checks). If
# every step fails pulling the image, rebuild it there — instructions live in
# that Dockerfile.
when:
  - event: pull_request
  - event: push
    branch: main

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      # fallow diffs against a merge base, which a partial clone lacks.
      partial: false

steps:
  - name: install
    image: greg-zone/bun-git:1.3.14
    commands:
      - bun install --frozen-lockfile

  - name: fmt
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run fmt:check

  - name: lint
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run lint

  - name: comment-fmt
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run comment-fmt:check

  - name: typecheck
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run typecheck

  - name: test
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run test

  # PR pipelines run on GitHub's merge ref, so `HEAD^1` is the base branch tip —
  # a merge base with no `git fetch`, which matters because only the clone step
  # holds forge credentials. PR-only: on a `main` push there is no base to diff
  # against.
  - name: fallow
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    when:
      - event: pull_request
    commands:
      - bun run astro sync
      - bun run fallow:audit -- --base 'HEAD^1'
