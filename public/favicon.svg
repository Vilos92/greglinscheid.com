<!--
  Milo at rest, the site mascot. The live component in src/components/milo/markup.ts
  renders this exact pose before its cursor tracker starts. This copy drops the
  animation hooks, the per-instance id namespacing, and the empty groups that existed
  only for the tracker to grab, leaving a plain still image.

  The viewBox is cropped to the art. Ears top out at y=-84 and the chin at y=56, so a
  144-unit square centered on the head fills the tile and lets only the outermost
  whisker tips run off the edge. The component's own 220-unit viewBox would spend most
  of a 16px favicon on empty margin.
-->
